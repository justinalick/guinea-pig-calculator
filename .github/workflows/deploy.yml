# Builds on every PR; deploys to Cloudflare Workers on every push to main.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/build.mjs

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret; pinning it skips wrangler's account lookup.
          CLOUDFLARE_ACCOUNT_ID: 49576194900361e39d981746d7ee4bc8
